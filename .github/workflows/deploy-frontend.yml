# Publica o frontend no GitHub Pages a cada push na main que mexa em frontend/.
# O domínio (mirantefinanceiro.online) é configurado em Settings → Pages, não aqui.
name: Deploy do frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # VITE_API_URL é embutida no bundle em tempo de build: mudar exige novo deploy.
      - run: npm run build
        env:
          VITE_API_URL: https://personal-management-backend.onrender.com

      # Fallback de SPA: o Pages serve o 404.html para qualquer rota que não seja
      # arquivo, então recarregar /lancamentos abre o app em vez de uma página de erro.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
